name: Release notes

on:
    pull_request:
        types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read

jobs:
    unreleased:
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Require an UNRELEASED.md entry for changes to src/
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  changed=$(git diff --name-only "$BASE...$HEAD")
                  if grep -q '^src/' <<< "$changed" && ! grep -qx 'UNRELEASED.md' <<< "$changed"; then
                    echo "::error::This PR changes src/. Add its entries to UNRELEASED.md, or add the 'no changelog' label."
                    exit 1
                  fi
